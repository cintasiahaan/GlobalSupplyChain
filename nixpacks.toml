[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.curl", "php84Extensions.dom", "php84Extensions.zip", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan storage:link || true"
]

[start]
cmd = "export SESSION_DRIVER=file; mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs && chmod -R 777 storage bootstrap/cache || true; php artisan config:clear || true; php artisan view:clear || true; php artisan migrate --force || true; php artisan db:seed --force || true; exec php artisan serve --host=0.0.0.0 --port=$PORT"
